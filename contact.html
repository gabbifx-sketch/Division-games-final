<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get in touch — DIVISION</title><link rel="icon" href="assets/division-mark.svg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="pages.css"></head><body><header class="simple-top"><a class="auth-brand" href="index.html"><img src="assets/division-mark.svg" alt=""> DIVISION</a><a class="text-link" href="index.html">← Back home</a></header><main class="static-page"><div class="eyebrow">CONTACT</div><h1>Get in touch</h1><p class="static-lead">Have a question, suggestion or game to recommend?</p><form class="admin-panel contact-form" id="contactForm"><label>Your name<input required placeholder="Name"></label><label>Email address<input type="email" required placeholder="you@example.com"></label><label>Subject<select><option>General question</option><option>Game suggestion</option><option>Report a problem</option></select></label><label>Message<textarea required rows="5" placeholder="Write your message..."></textarea></label><button class="primary-button" type="submit">Send message</button><p class="form-note" id="contactNote">Contact submission will be connected to the platform backend later.</p></form><script>document.getElementById('contactForm').addEventListener('submit',e=>{e.preventDefault();document.getElementById('contactNote').textContent='Form validated. Message sending will be enabled when the backend is connected.'})</script></main></body></html>
