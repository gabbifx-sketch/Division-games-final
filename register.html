<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — DIVISION</title><link rel="icon" href="assets/division-mark.svg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="pages.css"></head><body class="auth-body"><a class="auth-back" href="index.html">← Back to Division</a><main class="auth-layout"><div class="auth-decoration"><img src="assets/division-mark.svg" alt=""><h1>Your next<br><span>level starts here.</span></h1><p>Create your player identity and join the Division community.</p></div><form class="auth-card" id="registerForm"><a class="auth-brand" href="index.html"><img src="assets/division-mark.svg" alt=""> DIVISION</a><div class="eyebrow">JOIN THE COMMUNITY</div><h2>Create your account</h2><p class="auth-sub">It only takes a minute.</p><div class="field-pair"><label>First name<input name="firstName" placeholder="First name" required autocomplete="given-name"></label><label>Last name<input name="lastName" placeholder="Last name" required autocomplete="family-name"></label></div><label>Username<input name="username" placeholder="Choose a username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" autocomplete="username"></label><label>Email address<input type="email" name="email" placeholder="you@example.com" required autocomplete="email"></label><label>Password<input type="password" name="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirmPassword" placeholder="Enter password again" required minlength="8" autocomplete="new-password"></label><label class="check-label terms-check"><input type="checkbox" required> I agree to the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.</label><button class="primary-button" type="submit">Create account</button><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p><p class="form-note" id="authNote">Registration will be enabled when Supabase is connected.</p></form></main><script src="auth.js"></script></body></html>
