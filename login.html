<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — DIVISION</title><link rel="icon" href="assets/division-mark.svg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="pages.css"></head><body class="auth-body"><a class="auth-back" href="index.html">← Back to Division</a><main class="auth-layout"><div class="auth-decoration"><img src="assets/division-mark.svg" alt=""><h1>Play more.<br><span>Discover more.</span></h1><p>Your games, your profile, your community.</p></div><form class="auth-card" id="loginForm"><a class="auth-brand" href="index.html"><img src="assets/division-mark.svg" alt=""> DIVISION</a><div class="eyebrow">WELCOME BACK</div><h2>Log in to your account</h2><p class="auth-sub">Pick up where you left off.</p><label>Email address<input type="email" name="email" placeholder="you@example.com" required autocomplete="email"></label><label>Password<input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password" minlength="8"></label><div class="auth-options"><label class="check-label"><input type="checkbox" name="remember"> Remember me</label><a href="#" id="forgotLink">Forgot password?</a></div><button class="primary-button" type="submit">Log in</button><div class="auth-divider"><span>OR</span></div><button class="google-button" type="button" id="googleLogin"><b>G</b> Continue with Google</button><p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p><p class="form-note" id="authNote">Account sign-in will be enabled when Supabase is connected.</p></form></main><script src="auth.js"></script></body></html>
